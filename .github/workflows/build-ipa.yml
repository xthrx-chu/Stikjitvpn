name: Build StikJITVPN IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out integration repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out upstream StikDebug
        uses: actions/checkout@v4
        with:
          repository: StikDebug/StikDebug
          ref: main
          path: upstream

      - name: Apply StosVPN integration
        run: python3 patch_stikdebug.py "$GITHUB_WORKSPACE/upstream"

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Build unsigned archive
        working-directory: upstream
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -configuration Debug \
            -archivePath "$RUNNER_TEMP/StikJITVPN.xcarchive" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/StikJITVPN.xcarchive/Products/Applications/StikDebug.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/StikDebug.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/StikJITVPN-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/StikJITVPN-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: StikJITVPN-unsigned-ipa
          path: StikJITVPN-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
